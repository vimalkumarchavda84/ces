name: Run Postman (Newman) and publish reports

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-newman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman and reporters
        run: |
          npm install -g newman newman-reporter-html newman-reporter-junitfull

      - name: Run Postman collection with Newman
        run: |
          mkdir -p reports
          # adjust the collection path if you placed it elsewhere in the repo
          newman run cartapivalidation.postman_collection.json \
            --reporters cli,html,junitfull \
            --reporter-html-export reports/newman-report.html \
            --reporter-junitfull-export reports/newman-report.xml

      - name: Upload HTML report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: reports/newman-report.html

      - name: Upload JUnit XML report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-junit-report
          path: reports/newman-report.xml

      - name: Publish test report to GitHub Checks (JUnit)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Newman tests
          path: reports/newman-report.xml
          reporter: junit